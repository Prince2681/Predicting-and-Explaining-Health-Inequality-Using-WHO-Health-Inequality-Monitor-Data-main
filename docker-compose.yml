services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: who_health_inequality_app
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./images:/app/images
      - ./data:/app/data
      - ./mlflow.db:/app/mlflow.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: who_health_inequality_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    entrypoint: ["mlflow", "ui", "--backend-store-uri", "sqlite:///mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    depends_on:
      - app
    restart: unless-stopped
